<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Edit Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Edit Student</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Roll Number</label>

<input
type="text"
class="form-control"
value="{{ student[0] }}"
readonly>

</div>

<div class="mb-3">

<label>Name</label>

<input
type="text"
name="student_name"
class="form-control"
value="{{ student[1] }}"
required>

</div>

<div class="mb-3">

<label>Department</label>

<input
type="text"
name="department"
class="form-control"
value="{{ student[2] }}"
required>

</div>

<div class="mb-4">

<label>Year</label>

<input
type="text"
name="year"
class="form-control"
value="{{ student[3] }}"
required>

</div>

<button class="btn btn-warning">

Save Changes

</button>

<a href="/students" class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
